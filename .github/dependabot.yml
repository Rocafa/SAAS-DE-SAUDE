version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Maturidade: só propõe versão publicada há 14 dias ou mais (regra que já seguíamos à mão; PRs #202 e #236 de
    # 11/2026 traziam versões de 1 a 11 dias). Não vale para atualização de segurança, que continua imediata.
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # better-auth vem em PR próprio: a pilha do login real foi revisada pelo Guardião LGPD numa versão fixa,
        # e cada subida exige ler o changelog com ele. No grupo, travava as outras 18 atualizações.
        exclude-patterns: ["better-auth", "@better-auth/*"]
    ignore:
      # TypeScript 7 (compilador nativo) quebra o lint: typescript-eslint suporta só
      # typescript ">=4.8.4 <6.1.0" (testado em 09/10/2026, PR #4). Remover quando o
      # typescript-eslint publicar suporte ao TS 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # @types/node acompanha o Node de produção (22 LTS; CI e imagem usam 22). Tipos do Node 26
      # deixariam compilar APIs que não existem no 22 e só quebrariam em execução (PR #18, 10/10/2026).
      # Subir junto com o runtime, não antes.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # O init e o analyze do CodeQL precisam estar na MESMA versão (o analyze recusa a configuração
      # gravada por outra versão). Separados, os PRs #183 e #185 de 12/11/2026 falharam os dois.
      codeql:
        patterns: ["github/codeql-action*"]
  # Bases da imagem da API fixadas por digest (apps/api/Dockerfile): PR semanal com o digest novo.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    # Trocar de Node maior é decisão conjunta: build (node:22-*) e runtime (distroless nodejs22-*)
    # têm de mudar juntos, e @types/node também. O Dependabot só traz digests e versões menores.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

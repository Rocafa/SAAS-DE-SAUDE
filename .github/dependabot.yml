version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (compilador nativo) quebra o lint: typescript-eslint suporta só
      # typescript ">=4.8.4 <6.1.0" (testado em 09/10/2026, PR #4). Remover quando o
      # typescript-eslint publicar suporte ao TS 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # @types/node acompanha o Node de produção (22 LTS; CI e imagem usam 22). Tipos do Node 26
      # deixariam compilar APIs que não existem no 22 e só quebrariam em execução (PR #18, 10/10/2026).
      # Subir junto com o runtime, não antes.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Bases da imagem da API fixadas por digest (apps/api/Dockerfile): PR semanal com o digest novo.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly

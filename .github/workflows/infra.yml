name: Infra (Terraform)

# Checagem estática do Terraform: fmt, init sem backend, validate, tflint e checkov.
# NADA aqui fala com a AWS: sem credencial, sem OIDC, sem plan, sem apply. O apply é manual e
# exige aprovação dos sócios (docs/04-arquitetura/infra-staging.md §3).

on:
  # Todo PR dispara, porque a trava de TLS (job tls, segundos) vale para o repositório inteiro.
  # Economia de minutos do Actions (billing): os jobs pesados só rodam quando o PR mexe na infra
  # (job mudancas).
  pull_request:
  schedule:
    - cron: '23 6 * * 1' # semanal: pega regra nova do checkov/tflint e provider com problema
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  # Garante que nenhum provider tente achar credencial no metadata do runner.
  AWS_EC2_METADATA_DISABLED: 'true'
  # Raízes do Terraform (módulos em infra/terraform/modules entram pelas raízes que os chamam).
  RAIZES: bootstrap-state staging
  # Imagem oficial do checkov fixada por digest (3.3.19, publicada em 17/09/2026).
  CHECKOV_IMAGE: bridgecrew/checkov@sha256:d3e96adafdb315ca82e792ca8708c01adae85292800fb064c8b309b3d0cb7b80

jobs:
  mudancas:
    # Filtro por mudança sem ação de terceiros: diff entre a base do PR e o merge do PR.
    # Fora de PR (schedule, dispatch), roda tudo.
    name: o PR mexe na infra?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      infra: ${{ steps.filtro.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENTO" != pull_request ]; then echo infra=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD \
               | grep -Eq '^(infra/|apps/api/db/migrations/|\.github/workflows/infra\.yml$)'; then
            echo infra=true >> "$GITHUB_OUTPUT"
          else
            echo infra=false >> "$GITHUB_OUTPUT"
          fi

  tls:
    # Condição (a) da conferência da rodada 21 (revisoes/2026-10-23-jobs.md): desligar a validação
    # de certificado é proibido fora de infra/terraform/staging/ (o canary do staging fica lá, com a
    # exceção ligada em jobs-ready.tf até existir domínio). Roda em todo PR, sem depender da infra.
    # docs/ fica de fora (texto, não executa). Cada padrão tem uma letra entre colchetes para o
    # próprio workflow não casar consigo.
    # Limite: grep pega a forma literal; desligar por variável indireta passa (revisão humana).
    name: trava de TLS (validação de certificado)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: validação de certificado só desligada em staging
        run: |
          padroes='rejectunauthoriz[e]d[^,;}]{0,60}(false|!1)'      # Node/pg: opção literal
          padroes="$padroes|node_tls_reject_unauthoriz[e]d"         # variável global do Node (só serve para desligar)
          padroes="$padroes|validar_certificad[o].{0,40}false"      # a exceção do canary
          padroes="$padroes|sslmode=no-verif[y]"                    # pg: TLS sem conferir certificado
          padroes="$padroes|checkserveridentit[y]"                  # troca a conferência do nome
          padroes="$padroes|--insecur[e]([^a-z-]|$)|--no-check-certificat[e]|strict-ss[l][^a-z]{0,5}false"
          if git grep -nIiE "$padroes" -- . ':!infra/terraform/staging/' ':!docs/'; then
            echo "::error::Validação de TLS desligada fora de infra/terraform/staging/ (proibido em produção; infra-staging.md §4.4)."
            exit 1
          fi
          # IaC fora do staging não aponta canary/health check para o DNS do ALB (sem certificado válido).
          if git grep -nE 'dns_name\}/health' -- '*.tf' ':!infra/terraform/staging/'; then
            echo "::error::Canary fora do staging usando o DNS do ALB; use o domínio."; exit 1
          fi
          # Canary do staging: valida por padrão; só a variável do canary com o valor "false" desliga.
          c=infra/terraform/staging/canary/index.js
          grep -q "^const VALIDAR_CERTIFICAD[O] = process.env.VALIDAR_CERTIFICAD[O] !== 'false';$" "$c" \
            || { echo "::error::$c deve validar o certificado por padrão"; exit 1; }
          [ "$(grep -c 'rejectUnauthorized' "$c")" -eq 1 ] && grep -q 'rejectUnauthorized: VALIDAR_CERTIFICADO,' "$c" \
            || { echo "::error::$c: a opção de TLS deve vir só de VALIDAR_CERTIFICADO"; exit 1; }
          # A exceção do staging é explícita e tem prazo no comentário.
          t=infra/terraform/staging/jobs-ready.tf
          if grep -q 'VALIDAR_CERTIFICADO' "$t"; then
            grep -B3 'VALIDAR_CERTIFICAD[O] *= *"false"' "$t" | grep -q 'remover quando houver domínio' \
              || { echo "::error::$t: exceção de TLS sem o comentário 'remover quando houver domínio'"; exit 1; }
          fi

  terraform:
    name: fmt, validate, tflint e checkov
    needs: mudancas
    if: needs.mudancas.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Cache dos providers do Terraform
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
          # SHA-256 oficial de tflint_linux_amd64.zip (checksums.txt da release v0.64.0).
          checksums: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
          cache: true
          tflint_config_path: infra/terraform/.tflint.hcl

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (sem backend) e validate
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for raiz in $RAIZES; do
            echo "::group::$raiz"
            terraform -chdir="$raiz" init -backend=false -lockfile=readonly
            terraform -chdir="$raiz" validate
            echo "::endgroup::"
          done

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # download do ruleset aws sem estourar o rate limit
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          for raiz in $RAIZES; do
            echo "::group::$raiz"
            tflint --chdir="$raiz" --config "$PWD/.tflint.hcl" --format compact
            echo "::endgroup::"
          done

      - name: checkov
        run: |
          docker run --rm -v "$PWD:/tf:ro" "$CHECKOV_IMAGE" \
            --directory /tf --framework terraform --compact --quiet \
            --skip-path '\.terraform/' --download-external-modules false

      # Travas de desenho que nenhum linter conhece.
      - name: Travas do projeto
        run: |
          # ALB usa liveness (/health), nunca /health/ready (ver comentário em staging/app.tf).
          grep -Eq 'alb_health_check_path *= *"/health"' staging/app.tf
          # Bootstrap do RDS repete o REVOKE TEMPORARY (I14).
          grep -Eiq 'REVOKE +TEMPORARY' ../rds/bootstrap.sql
          # Nenhuma senha/token no estado: segredo nasce efêmero e vai só para atributo *_wo
          # (ou é gerado pelo próprio RDS em manage_master_user_password).
          if grep -En '^\s*(auth_token|secret_string|master_password)\s*=|resource\s+"random_password"' \
               --include='*.tf' -r .; then
            echo "Segredo persistido no estado; use ephemeral + atributo write-only (_wo)."; exit 1
          fi
          # Export de log do RDS só com o grupo declarado (retenção + KMS); senão nasce "nunca expira".
          if grep -rq --include='*.tf' 'enabled_cloudwatch_logs_exports' . \
             && ! grep -rq --include='*.tf' '"/aws/rds/instance/' .; then
            echo "enabled_cloudwatch_logs_exports sem aws_cloudwatch_log_group do RDS declarado."; exit 1
          fi
          # Postgres nunca loga valor de linha nem SQL (V2 do PR #58).
          grep -Eq 'name *= *"log_error_verbosity"' staging/dados.tf
          grep -Eq 'name *= *"log_min_error_statement"' staging/dados.tf
          # R11 do PR #61: pgaudit só com DDL e ROLE (nunca read/write/all), sem bind nem relação,
          # alarme de DDL sensível no SNS e bootstrap sem senha no log.
          grep -Eq 'value *= *"[^"]*pgaudit[^"]*"' staging/dados.tf
          grep -A1 'name *= *"pgaudit.log"' staging/dados.tf | grep -Eq 'value *= *"ddl, ?role"'
          grep -A1 'name *= *"pgaudit.log_parameter"' staging/dados.tf | grep -Eq 'value *= *"(0|off)"'
          grep -A1 'name *= *"pgaudit.log_relation"' staging/dados.tf | grep -Eq 'value *= *"(0|off)"'
          grep -q 'log_group_name *= *aws_cloudwatch_log_group.rds\["postgresql"\].name' staging/auditoria-banco.tf
          grep -q 'alarm_actions *= *\[aws_sns_topic.alertas_seguranca.arn\]' staging/auditoria-banco.tf
          # R12: função, policy e dono também alertam; a conferência pós-deploy existe.
          # R10 do #58: constraint, índice, rule, REPLICA/ALWAYS, GRANT/REVOKE, session_replication_role;
          # O1 da conferência da R10: CREATE TRIGGER, REVOKE ROLE, DROP ... CASCADE, DETACH PARTITION.
          for f in alter-table-guardas constraint session-replication-role owner-to \
                   create-trigger drop-trigger alter-role create-function alter-function drop-function \
                   create-policy alter-policy drop-policy drop-index create-rule \
                   grant revoke grant-role revoke-role alter-default-privileges; do
            grep -Eq "^\s*$f\s*=" staging/auditoria-banco.tf || { echo "filtro $f ausente"; exit 1; }
          done
          # Cada palavra-chave das regex agrupadas continua lá (DISABLE TRIGGER, NO FORCE RLS,
          # DISABLE RLS, DISABLE RULE, ENABLE REPLICA, ENABLE ALWAYS, DROP/ALTER CONSTRAINT, DROP NOT NULL,
          # DETACH PARTITION, DROP ... CASCADE).
          for k in '[Tt][Rr][Ii][Gg][Gg][Ee][Rr]"' '[Nn][Oo]\\s+[Ff][Oo][Rr][Cc][Ee]' \
                   '[Dd][Ii][Ss][Aa][Bb][Ll][Ee]\\s+[Rr][Oo][Ww]' '[Dd][Ii][Ss][Aa][Bb][Ll][Ee]\\s+[Rr][Uu][Ll][Ee]' \
                   '[Rr][Ee][Pp][Ll][Ii][Cc][Aa]"' '[Aa][Ll][Ww][Aa][Yy][Ss]"' \
                   '[Dd][Rr][Oo][Pp]\\s+[Cc][Oo][Nn]' '[Aa][Ll][Tt][Ee][Rr]\\s+[Cc][Oo][Nn]' \
                   '[Dd][Rr][Oo][Pp]\\s+[Nn][Oo][Tt]\\s+[Nn][Uu][Ll][Ll]' \
                   '[Dd][Ee][Tt][Aa][Cc][Hh]\\s+[Pp][Aa][Rr]' '\\s[Cc][Aa][Ss][Cc][Aa][Dd][Ee]'; do
            grep -Fq "$k" staging/auditoria-banco.tf || { echo "regex sem $k"; exit 1; }
          done
          # Cota do CloudWatch: no máximo 5 filtros com regex por log group.
          n=$(grep -Ec '^\s*[a-z-]+\s*=\s*"%' staging/auditoria-banco.tf)
          [ "$n" -le 5 ] || { echo "$n filtros com regex (máximo 5 por log group)"; exit 1; }
          # R3 do parecer de jobs (infra-staging.md §4.4): REDIS_URL obrigatório na tarefa da API,
          # sem JOBS_HABILITADOS, alarme (termo exato) para cada marcador de falha dos jobs no log
          # group da API, todos para a operação; DPO só para falha de retenção/revogação.
          grep -q '{ name = "REDIS_URL", valueFrom = "${aws_secretsmanager_secret.app\["redis"\].arn}:url::" }' staging/app.tf
          grep -Eq 'secrets +=\s*local.api_segredos' staging/app.tf
          grep -q 'contains(\[for s in local.api_segredos : s.name\], "REDIS_URL")' staging/app.tf
          if grep -rEn --include='*.tf' 'name *= *"JOBS_HABILITADOS"' .; then
            echo "JOBS_HABILITADOS definido no IaC (§4.4: só com incidente registrado)."; exit 1
          fi
          for t in JOB_ATRASADO JOBS_DESLIGADOS JOBS_NAO_AGENDADOS JOB_ALARME JOB_CLINICA_FALHOU \
                   JOB_TRILHA_FALHOU JOBS_DESLIGADOS_POR_OPCAO JOB_TRABALHADOR_ERRO JOB_FALHOU JOB_DESCONHECIDO; do
            grep -Eq "termo +=\s*\"$t\"" staging/jobs.tf || { echo "filtro $t ausente"; exit 1; }
          done
          # JOBS_DESLIGADOS não casa com JOBS_DESLIGADOS_POR_OPCAO (N2) e é o único marcador geral com DPO.
          grep -A3 '^\s*jobs-desligados = {' staging/jobs.tf | grep -q 'excluir *= *\["JOBS_DESLIGADOS_POR_OPCAO"\]'
          grep -A8 '^\s*jobs-desligados = {' staging/jobs.tf | grep -Eq 'dpo +=\s*true'
          [ "$(grep -Ec 'dpo +=\s*true' staging/jobs.tf)" -eq 1 ] || { echo "DPO só em JOBS_DESLIGADOS entre os gerais"; exit 1; }
          # DPO: JOB_ATRASADO/JOB_ALARME dos 6 jobs de retenção/revogação, alarme só no tópico do DPO.
          for j in whatsapp-retencao importador-expurgo notas-privadas-ciclo retencao-fiscal \
                   responsaveis-descarte portal-representacoes; do
            grep -q "^\s*\"$j\",$" staging/jobs.tf || { echo "job de retenção $j fora do alarme do DPO"; exit 1; }
          done
          grep -q 'setproduct(\["JOB_ATRASADO", "JOB_ALARME"\], local.jobs_de_retencao)' staging/jobs.tf
          grep -q 'alarm_actions = \[aws_sns_topic.alertas_dpo.arn\]' staging/jobs.tf
          grep -q 'log_group_name *= *aws_cloudwatch_log_group.api.name' staging/jobs.tf
          grep -q 'pattern *= *join(" ", concat(\["\\"${each.value.termo}\\""\]' staging/jobs.tf
          ! grep -q '"%' staging/jobs.tf || { echo "jobs.tf usa regex; só termo exato"; exit 1; }
          grep -q 'resource "aws_cloudwatch_metric_alarm" "jobs"' staging/jobs.tf
          grep -q 'aws_sns_topic.alertas_seguranca.arn, aws_sns_topic.alertas_dpo.arn\] : \[aws_sns_topic.alertas_seguranca.arn\]' staging/jobs.tf
          grep -q 'resource "aws_sns_topic" "alertas_dpo"' staging/jobs.tf
          grep -q 'aws_cloudwatch_metric_alarm.jobs' staging/acesso-humano.tf
          # jobs != bullmq no /health/ready: canary do Synthetics em sa-east-1 (jobs-ready.tf).
          unzip -p staging/canary/jobs-ready.zip nodejs/node_modules/index.js | cmp - staging/canary/index.js \
            || { echo "canary/jobs-ready.zip diferente de canary/index.js: refazer o zip"; exit 1; }
          grep -q "jobs !== 'bullmq'" staging/canary/index.js
          grep -q 'URL_READY = "https://${aws_lb.this.dns_name}/health/ready"' staging/jobs-ready.tf
          grep -q 'expression = "rate(5 minutes)"' staging/jobs-ready.tf
          grep -A30 'resource "aws_cloudwatch_metric_alarm" "jobs_ready"' staging/jobs-ready.tf > /tmp/alarme-ready
          grep -q 'metric_name = "SuccessPercent"' /tmp/alarme-ready
          grep -Eq 'evaluation_periods += 6' /tmp/alarme-ready
          grep -Eq 'datapoints_to_alarm += 3' /tmp/alarme-ready
          grep -q 'treat_missing_data = "breaching"' /tmp/alarme-ready
          grep -q 'alarm_actions = \[aws_sns_topic.alertas_seguranca.arn\]' /tmp/alarme-ready
          grep -q 'aws_cloudwatch_metric_alarm.jobs_ready.arn' staging/acesso-humano.tf
          # Cota de 5 filtros com regex no log group da API (os de jobs são termos exatos).
          n=$(grep -rlE --include='*.tf' 'log_group_name *= *aws_cloudwatch_log_group.api.name' staging | xargs grep -Ec '"%' | awk -F: '{s+=$NF} END {print s+0}')
          [ "$n" -le 5 ] || { echo "$n filtros com regex no log group da API (máximo 5)"; exit 1; }
          grep -Eiq 'CREATE EXTENSION IF NOT EXISTS pgaudit' ../rds/bootstrap.sql
          grep -Eq "SET LOCAL pgaudit.log = 'none'" ../rds/bootstrap.sql
          # Ressalvas do PR #58 (infra-staging.md §4.1).
          # R2: bucket de logs de acesso só lido pelo papel de investigação; N2: leituras no CloudTrail.
          grep -q 'sid *= *"LeituraSoPelaInvestigacao"' staging/s3.tf
          grep -q 'starts_with = \["${aws_s3_bucket.logs.arn}/"\]' staging/cloudtrail.tf
          # R4: humano não decifra com as chaves de dado (Deny na key policy).
          grep -q 'sid *= *"HumanoNaoDecifra"' staging/kms.tf
          grep -Eq 'chaves_sem_humanos *= *\[[^]]*"rds"[^]]*"s3"[^]]*"exportacoes"' staging/kms.tf
          # R5: slow-log do Redis desligado por padrão (grava argumentos dos comandos).
          grep -A4 'variable "redis_slow_log"' staging/variables.tf | grep -Eq 'default *= *false'
          # R7: backup nunca sai de sa-east-1.
          if grep -rEn --include='*.tf' '^\s*copy_action\s*\{' .; then
            echo "copy_action no AWS Backup: backup não sai de sa-east-1 (D8)."; exit 1
          fi
          # N1: chave do objeto de exportação só UUID opaco.
          grep -q 'sid *= *"ChaveSoUuidOpaco"' staging/exportacoes.tf
          # R3-b do parecer do importador (api-dominio.md §12d): chave de lote separável no IAM.
          # Cada statement da API é recortado do sid até o próximo e conferido.
          k=staging/kms-clinicas.tf
          api() { sed -n '/data "aws_iam_policy_document" "api_kek"/,/^}/p' "$k" \
                  | awk -v s="sid *= *\"$1\"" '$0 ~ s {p=1; print; next} p && /sid *=/ {exit} p'; }
          gestor() { sed -n '/data "aws_iam_policy_document" "gestor_chaves"/,/^}/p' "$k" \
                  | awk -v s="sid *= *\"$1\"" '$0 ~ s {p=1; print; next} p && /sid *=/ {exit} p'; }
          grep -q 'role *= *aws_iam_role.api_tarefa.id' "$k"
          # Criar: purpose só tenant_data/import_batch, tenant_id presente, TagKeys restrito.
          api CriarChaveDaClinica | grep -A2 '"aws:RequestTag/purpose"' | grep -q 'values *= *\["tenant_data"\]'
          api CriarChaveDeLote    | grep -A2 '"aws:RequestTag/purpose"' | grep -q 'values *= *\["import_batch"\]'
          api CriarChaveDeLote    | grep -q '"aws:RequestTag/batch_id"'
          api TagNaCriacao        | grep -A2 '"aws:RequestTag/purpose"' | grep -q 'values *= *\["tenant_data", "import_batch"\]'
          for s in CriarChaveDaClinica CriarChaveDeLote TagNaCriacao; do
            api $s | grep -q '"aws:RequestTag/tenant_id"' || { echo "$s sem tenant_id"; exit 1; }
            api $s | grep -q '"aws:TagKeys"' || { echo "$s sem aws:TagKeys"; exit 1; }
          done
          grep -q 'kms_tags_permitidas *= *\["tenant_id", "purpose", "batch_id"\]' "$k"
          # Nenhum outro statement de CreateKey/TagResource na API.
          n=$(sed -n '/data "aws_iam_policy_document" "api_kek"/,/^}/p' "$k" | grep -Ec '"kms:(CreateKey|TagResource)"\]')
          [ "$n" -eq 4 ] || { echo "CreateKey/TagResource em $n statements da API (esperado 4: 3 Allow + 1 Deny)"; exit 1; }
          # Exclusão: Allow só em import_batch; Deny fora de import_batch; Cancel/EnableKey negados no lote.
          api ExclusaoSoDaChaveDeLote | grep -q 'actions *= *\["kms:ScheduleKeyDeletion"\]'
          api ExclusaoSoDaChaveDeLote | grep -A2 '"aws:ResourceTag/purpose"' | grep -q 'values *= *\["import_batch"\]'
          api NuncaExcluiChaveDaClinica | grep -q 'effect *= *"Deny"'
          api NuncaExcluiChaveDaClinica | grep -q 'test *= *"StringNotEquals"'
          api LoteDestruidoNaoVolta | grep -q 'effect *= *"Deny"'
          api LoteDestruidoNaoVolta | grep -q '"kms:CancelKeyDeletion", "kms:EnableKey"'
          api LoteDestruidoNaoVolta | grep -A2 '"aws:ResourceTag/purpose"' | grep -q 'values *= *\["import_batch"\]'
          [ "$(sed -n '/data "aws_iam_policy_document" "api_kek"/,/^}/p' "$k" | grep -c 'ScheduleKeyDeletion"\]')" -eq 1 ] \
            || { echo "ScheduleKeyDeletion em mais de um Allow da API"; exit 1; }
          api NuncaDestagear | grep -q '"kms:UntagResource"'
          api NuncaRetagear | grep -q 'effect *= *"Deny"'
          # Uso: EncryptionContext tenant_id igual à tag tenant_id da chave.
          api DekDaClinica | grep -q '"kms:GenerateDataKey", "kms:Decrypt", "kms:ReEncryptFrom", "kms:ReEncryptTo"'
          api DekDaClinica | grep -A2 '"kms:EncryptionContext:tenant_id"' | grep -q 'values *= *\["&{aws:ResourceTag/tenant_id}"\]'
          api RotacaoSoDaClinica | grep -A2 '"aws:ResourceTag/purpose"' | grep -q 'values *= *\["tenant_data"\]'
          # Eliminação da clínica (G3) é do gestor, só em tenant_data; o gestor nunca reabre lote.
          gestor AgendarDestruicaoComJanela | grep -A2 '"aws:ResourceTag/purpose"' | grep -q 'values *= *\["tenant_data"\]'
          gestor GerirKekDeClinica | grep -A2 '"aws:ResourceTag/purpose"' | grep -q 'values *= *\["tenant_data"\]'
          gestor LoteDestruidoNaoVolta | grep -q 'effect *= *"Deny"'
          # Alerta de CancelKeyDeletion/EnableKey no tópico de segurança.
          grep -q 'eventName   = \["CancelKeyDeletion", "EnableKey"\]' "$k"
          grep -q 'aws_cloudwatch_event_rule.kms_reativacao.arn' staging/acesso-humano.tf
          # Região: somente sa-east-1.
          if grep -En 'region\s*=\s*"[a-z]{2}-[a-z]+-[0-9]"' --include='*.tf' -r . | grep -v 'sa-east-1'; then
            echo "Região fora de sa-east-1."; exit 1
          fi

  guardas-banco:
    # R12 do PR #61: a conferência pós-deploy precisa funcionar ANTES de ser preciso. Sobe um
    # PostgreSQL 16 descartável no runner (sem rede, sem segredo: senhas geradas na hora), aplica
    # bootstrap + migrações do repositório e prova que CREATE OR REPLACE FUNCTION, ALTER FUNCTION,
    # ALTER POLICY e NO FORCE RLS aparecem na comparação, e também (R10 do #58) DROP CONSTRAINT,
    # DROP NOT NULL, DROP INDEX, CREATE RULE, ENABLE REPLICA/ALWAYS TRIGGER, GRANT de tabela e de
    # coluna e ALTER DEFAULT PRIVILEGES; e (O2 da conferência da R10) atributo de papel e vínculo
    # em pg_auth_members.
    name: conferência das guardas do banco (autoteste)
    needs: mudancas
    if: needs.mudancas.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: autoteste do verificar-guardas
        env:
          PG_BIN: /usr/lib/postgresql/16/bin # PostgreSQL 16 já vem na imagem ubuntu-24.04
        run: sh infra/rds/verificar-guardas.sh autoteste

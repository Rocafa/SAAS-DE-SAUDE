name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # segunda-feira, 03:17 (horário de Brasília)

permissions:
  contents: read

jobs:
  analyze:
    name: Análise estática de segurança (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # Actions fixadas por SHA (cadeia de suprimentos); o comentário indica a versão.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended
      # Repositório privado sem GitHub Code Security: não há upload para a aba Security.
      # Os resultados ficam como artefato e o job falha se houver achado de nível "error".
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          output: codeql-results
      - name: Publicar resultados (SARIF)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: codeql-results
      - name: Falhar se houver achado grave
        run: |
          n=$(jq '[.runs[].results[]? | select((.level // "warning") == "error")] | length' codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          echo "Achados de nível error: $n"
          test "$n" -eq 0

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # segunda-feira, 03:17 (horário de Brasília)

permissions:
  contents: read

jobs:
  analyze:
    name: Análise estática de segurança (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # Actions fixadas por SHA (cadeia de suprimentos); o comentário indica a versão.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      # Repositório público (desde 27/10/2026): o code scanning é grátis, então os resultados vão para a aba
      # Security e para as anotações do PR, inclusive os de nível warning. Continuam também como artefato, e o
      # job falha se houver achado de nível "error" (check obrigatório da proteção da main).
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: always
          output: codeql-results
      - name: Publicar resultados (SARIF)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-results
      - name: Falhar se houver achado grave
        run: |
          n=$(jq '[.runs[].results[]? | select((.level // "warning") == "error")] | length' codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          echo "Achados de nível error: $n"
          test "$n" -eq 0

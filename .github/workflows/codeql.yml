name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # segunda-feira, 03:17 (horário de Brasília)

permissions:
  contents: read

jobs:
  analyze:
    name: Análise estática de segurança (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Actions fixadas por SHA (cadeia de suprimentos); o comentário indica a versão.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      # Repositório privado sem GitHub Code Security: não há upload para a aba Security.
      # Os resultados ficam como artefato e o job falha se houver achado de nível "error".
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          upload: never
          output: codeql-results
      - name: Publicar resultados (SARIF)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif
          path: codeql-results
      - name: Falhar se houver achado grave
        run: |
          n=$(jq '[.runs[].results[]? | select((.level // "warning") == "error")] | length' codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          echo "Achados de nível error: $n"
          test "$n" -eq 0

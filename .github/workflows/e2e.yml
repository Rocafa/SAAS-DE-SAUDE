name: E2E do front

# Playwright do apps/web (celular 375 px e computador 1280 px) contra o build de produção,
# com o adaptador de dados fake (dados sintéticos), como o front roda localmente.
# Economia de minutos: só em PR que muda o front ou o que ele importa.
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (só o web e o que ele usa)
        run: pnpm install --frozen-lockfile --filter "@plataforma/web..."

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'packages/shared/src/**') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build de produção
        run: pnpm --filter "@plataforma/web..." build

      - name: Versão do Playwright
        id: pw
        run: echo "versao=$(pnpm --filter @plataforma/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: navegadores
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}-chromium

      - name: Instalar Chromium e dependências do sistema
        if: steps.navegadores.outputs.cache-hit != 'true'
        run: pnpm --filter @plataforma/web exec playwright install --with-deps chromium

      - name: Dependências do sistema (navegador veio do cache)
        if: steps.navegadores.outputs.cache-hit == 'true'
        run: pnpm --filter @plataforma/web exec playwright install-deps chromium

      # 2 workers: com mais, as telas competem por CPU e estouram o timeout de 30 s.
      - name: Playwright
        run: pnpm --filter @plataforma/web exec playwright test --workers=2

      # Só dados sintéticos do adaptador fake; guardado poucos dias.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: e2e-web-relatorio
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

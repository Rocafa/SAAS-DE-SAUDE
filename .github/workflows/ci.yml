name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  quality:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # O cache do pnpm exige pnpm-lock.yaml; enquanto o lockfile não for commitado, roda sem cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('pnpm-lock.yaml') == ''
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm turbo run lint typecheck test

  rls:
    name: Isolamento entre tenants (RLS)
    runs-on: ubuntu-latest
    needs: secrets
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plataforma_saude
          POSTGRES_USER: postgres
          # Senha descartável do container efêmero de CI (sem dado algum). Não é segredo.
          POSTGRES_PASSWORD: ci-efemero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plataforma_saude"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci-efemero
      POSTGRES_USER: postgres
      POSTGRES_DB: plataforma_saude
      POSTGRES_PASSWORD: ci-efemero
      DATABASE_MIGRATOR_URL: postgresql://app_migrator:ci-efemero@localhost:5432/plataforma_saude
      DATABASE_URL: postgresql://app_user:ci-efemero@localhost:5432/plataforma_saude
      DATABASE_AUTH_URL: postgresql://app_auth:ci-efemero@localhost:5432/plataforma_saude
      # Só o teste dos operadores nominais (O-R17b, 0047) usa: cria/remove papéis LOGIN membros de app_migrator,
      # como o usuário mestre faz no RDS. Container efêmero, senha descartável.
      DATABASE_ADMIN_URL: postgresql://postgres:ci-efemero@localhost:5432/plataforma_saude
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('pnpm-lock.yaml') == ''
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      # Mesmo script do docker-compose local: cria app_migrator (dono) e app_user (NOBYPASSRLS).
      - name: Criar papéis do banco
        run: sh infra/local/postgres-init.sh
      - name: Migrar (papel app_migrator)
        run: pnpm --filter @plataforma/api db:migrate
      - name: Teste de isolamento (papel app_user)
        run: pnpm --filter @plataforma/api test:rls

  deps:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: excecoes-de-auditoria (vencidas bloqueiam)
        # docs/03-seguranca-lgpd/excecoes-de-auditoria.md: toda exceção tem data de revisão; vencida, a CI falha.
        # Cada GHSA do ignoreGhsas precisa da linha "<!-- vence: <GHSA> <AAAA-MM-DD> -->" no documento, com data futura.
        run: |
          doc=docs/03-seguranca-lgpd/excecoes-de-auditoria.md
          hoje=$(date -u +%F)
          for g in $(grep -o 'GHSA-[a-z0-9-]*' package.json | sort -u); do
            data=$(grep -oE "<!-- vence: $g [0-9]{4}-[0-9]{2}-[0-9]{2} -->" "$doc" | awk '{print $4}' | head -1)
            [ -n "$data" ] || { echo "::error::$g ignorada sem data de vencimento em $doc"; exit 1; }
            if [ "$hoje" \> "$data" ]; then echo "::error::exceção $g venceu em $data: revise ($doc)"; exit 1; fi
            echo "$g vence em $data"
          done
      - name: pnpm audit (high/critical bloqueia)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm audit --audit-level=high
          else
            echo "Sem pnpm-lock.yaml ainda — auditoria pulada."
          fi
